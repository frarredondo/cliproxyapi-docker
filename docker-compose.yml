services:
  cli-proxy-api:
    build:
      context: .
      args:
        CLIPROXY_VERSION: ${CLIPROXY_VERSION:-v7.2.78}
    image: cliproxyapi:${CLIPROXY_VERSION:-v7.2.78}
    container_name: cli-proxy-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8317:8317"
      # OAuth login callback ports — uncomment only while running a provider
      # login that needs a browser redirect, then comment out again.
      # - "8085:8085"    # Gemini
      # - "1455:1455"    # Codex / OpenAI
      # - "54545:54545"  # Claude
      # - "51121:51121"
      # - "11451:11451"
    volumes:
      - ./config:/CLIProxyAPI/config
      - cliproxy_auths:/CLIProxyAPI/auths
      - cliproxy_logs:/CLIProxyAPI/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:$${CLIPROXY_PORT:-8317}/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cliproxy_auths:
  cliproxy_logs:
